services:
  sis:
    # Keep this image tag identical to Makefile's DOCKER_IMAGE:VERSION, so
    # `make docker-build && make restart` runs the image you just built.
    # Without this, compose silently falls back to its own project-named
    # image (sis-sis) and `make docker-build` builds a different one.
    image: docker.sunet.se/iam_vc/sis:local
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - SIS_CONFIG_YAML=/etc/sis/config.yaml
    volumes:
      - ./config.yaml:/etc/sis/config.yaml:ro
      # sis.file_import paths are relative to the config file.
      - ./testdata:/etc/sis/testdata:ro
      # Dev TLS certificate and CA (make pki); used by sis.httpserver.tls.
      - ./developer_tools/pki/tls_sis_chain.pem:/etc/sis/pki/tls.crt:ro
      - ./developer_tools/pki/tls_sis.key:/etc/sis/pki/tls.key:ro
      - ./developer_tools/pki/rootCA.crt:/etc/sis/pki/rootCA.crt:ro
    # Loopback by default: config.yaml trusts the mellon test IdP, whose
    # credentials are public. To expose SIS to other hosts deliberately, set
    # SIS_PUBLISH_ADDR (e.g. SIS_PUBLISH_ADDR=0.0.0.0) and trust a real
    # issuer first.
    ports:
      - "${SIS_PUBLISH_ADDR:-127.0.0.1}:8080:8080"
    networks:
      sisnet:
        ipv4_address: 172.28.0.10

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sis
      POSTGRES_PASSWORD: sis
      POSTGRES_DB: sis
    # Loopback only: the credentials above are public development defaults,
    # so the database must not be reachable from other hosts. Containers
    # reach it as postgres:5432 over sisnet regardless of this mapping.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sis -d sis"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - sis_pgdata:/var/lib/postgresql/data
    networks:
      - sisnet

  # AMQP 1.0 broker for sis.adapter.inbound.amqpapi. Topology (sis.commands,
  # dead-lettering to sis.commands.dlq; sis.test.commands and its DLQ for
  # amqpapi's TestBroker only) and the user sis/sis come from
  # developer_tools/rabbitmq/definitions.json. Management UI:
  # http://localhost:15673 (sis/sis).
  rabbitmq:
    image: rabbitmq:4-management
    # Started as root, the entrypoint can leave .erlang.cookie unreadable.
    user: rabbitmq
    # Loopback only: the credentials are public development defaults. Host
    # ports are off by one from the standard 5672/15672, which VS Code may
    # already forward from a dev container; inside sisnet they are standard.
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - ./developer_tools/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-sis.conf:ro
      - ./developer_tools/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - sisnet

  # Keycloak-compatible OIDC provider for local OIDC RP testing.
  mellon:
    image: docker.sunet.se/iam_vc/mellon:latest
    # Loopback only: realm.json ships publicly known test identities
    # (admin/password) and the sis-secret client credential, so this IdP
    # must not be reachable from other hosts. SIS reaches it as mellon:8443
    # over sisnet regardless of these mappings.
    ports:
      - "127.0.0.1:9080:8080"
      - "127.0.0.1:9443:8443"
    environment:
      - KC_HTTP_PORT=8080
      - KC_HTTP_ENABLED=true
      # Tokens carry this as iss, so it must be how the browser reaches
      # mellon (https, published on 127.0.0.1:9443), and equal
      # sis.auth.issuers[].issuer in config.yaml.
      - KC_HOSTNAME_URL=https://localhost:9443
      - KC_PROXY_HEADERS=xforwarded
      # Dev TLS certificate (make pki) for https on 8443.
      - KC_HTTPS_CERTIFICATE_FILE=/etc/mellon/pki/tls.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/mellon/pki/tls.key
    volumes:
      - ./realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./developer_tools/pki/tls_mellon_chain.pem:/etc/mellon/pki/tls.crt:ro
      - ./developer_tools/pki/tls_mellon.key:/etc/mellon/pki/tls.key:ro
    networks:
      sisnet:
        # Must match IP.2 in its certificate (developer_tools/scripts/create_pki.sh).
        ipv4_address: 172.28.0.11

networks:
  sisnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  sis_pgdata:
