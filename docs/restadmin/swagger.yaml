basePath: /api/v1
definitions:
  auth.ErrorResponse:
    properties:
      error:
        description: |-
          Error is "unauthorized" (401: missing, invalid or expired token, or
          one from an untrusted issuer), "forbidden" (403: the token lacks the
          required scope) or "unavailable" (503: the token's issuer could not be
          reached to check it; retry later).
        example: unauthorized
        type: string
      message:
        example: missing bearer token
        type: string
    type: object
  command.Metadata:
    properties:
      input_format:
        description: 'InputFormat is the format of data. Supported: elm.'
        example: elm
        type: string
      output_format:
        description: 'OutputFormat is the format to return (parse only). Supported:
          eduapi, oeapi.'
        example: eduapi
        type: string
    required:
    - input_format
    type: object
  command.PopulateReply:
    properties:
      expiresAt:
        description: |-
          ExpiresAt is when the loaded records stop being served. Absent when no
          ttl was given. A record that already existed without expiry keeps
          none.
        type: string
      items:
        description: Items lists every stored record, in the order written.
        items:
          $ref: '#/definitions/readmodel.PopulateItem'
        type: array
      metadata:
        $ref: '#/definitions/command.Metadata'
      warnings:
        items:
          type: string
        type: array
    type: object
  command.PopulateRequest:
    properties:
      data:
        description: Data is the document to load, e.g. an ELM v3 credential (JSON-LD).
        type: object
      metadata:
        $ref: '#/definitions/command.Metadata'
      ttl:
        description: |-
          TTL is how long the records are served, as a Go duration ("24h",
          "90m"). Omitted: they never expire.
        example: 24h
        type: string
    required:
    - data
    type: object
  convertapi.ParseReply:
    properties:
      data:
        description: |-
          Data holds the converted records, one array per resource collection of
          the output format (Edu-API: persons, orgs, academicSessions, courses,
          programs, classes, enrollments, results; OEAPI: persons, organizations,
          academicSessions, courses, programs, offerings, associations, results).
          References between them are sourcedIds.
        type: object
      metadata:
        $ref: '#/definitions/command.Metadata'
      warnings:
        description: Warnings name the parts of the document that were not converted.
        items:
          type: string
        type: array
    type: object
  convertapi.ParseRequest:
    properties:
      data:
        description: Data is the document to convert, e.g. an ELM v3 credential (JSON-LD).
        type: object
      metadata:
        $ref: '#/definitions/command.Metadata'
    required:
    - data
    type: object
  domain.AcademicSession:
    properties:
      createdAt:
        type: string
      endDate:
        type: string
      expiresAt:
        description: |-
          ExpiresAt is when the record stops being served and becomes eligible
          for deletion; nil means it never expires. Server-managed: only
          POST /api/v1/populate with a ttl sets it, and /api/v1 writes ignore it.
        type: string
      id:
        type: string
      sourcedId:
        type: string
      startDate:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      title:
        type: string
      type:
        description: e.g. term, semester, schoolYear
        type: string
      updatedAt:
        type: string
    type: object
  domain.Contact:
    properties:
      type:
        type: string
      value:
        type: string
    type: object
  domain.Course:
    properties:
      code:
        type: string
      createdAt:
        type: string
      expiresAt:
        description: |-
          ExpiresAt is when the record stops being served and becomes eligible
          for deletion; nil means it never expires. Server-managed: only
          POST /api/v1/populate with a ttl sets it, and /api/v1 writes ignore it.
        type: string
      id:
        type: string
      orgId:
        type: string
      sourcedId:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  domain.Enrollment:
    properties:
      createdAt:
        type: string
      expiresAt:
        description: |-
          ExpiresAt is when the record stops being served and becomes eligible
          for deletion; nil means it never expires. Server-managed: only
          POST /api/v1/populate with a ttl sets it, and /api/v1 writes ignore it.
        type: string
      id:
        type: string
      offeringId:
        type: string
      personId:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/domain.Role'
        description: e.g. student, faculty
      sourcedId:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      updatedAt:
        type: string
    type: object
  domain.Identifier:
    properties:
      type:
        type: string
      value:
        type: string
    type: object
  domain.Offering:
    properties:
      academicSessionId:
        type: string
      courseId:
        type: string
      createdAt:
        type: string
      expiresAt:
        description: |-
          ExpiresAt is when the record stops being served and becomes eligible
          for deletion; nil means it never expires. Server-managed: only
          POST /api/v1/populate with a ttl sets it, and /api/v1 writes ignore it.
        type: string
      id:
        type: string
      orgId:
        type: string
      sourcedId:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  domain.Organization:
    properties:
      createdAt:
        type: string
      expiresAt:
        description: |-
          ExpiresAt is when the record stops being served and becomes eligible
          for deletion; nil means it never expires. Server-managed: only
          POST /api/v1/populate with a ttl sets it, and /api/v1 writes ignore it.
        type: string
      id:
        type: string
      name:
        type: string
      parentId:
        type: string
      sourcedId:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      type:
        description: e.g. institution, school, department
        type: string
      updatedAt:
        type: string
    type: object
  domain.Person:
    properties:
      createdAt:
        type: string
      dateOfBirth:
        type: string
      emails:
        items:
          $ref: '#/definitions/domain.Contact'
        type: array
      expiresAt:
        description: 'ExpiresAt: see Base.ExpiresAt.'
        type: string
      familyName:
        type: string
      givenName:
        type: string
      id:
        type: string
      identifiers:
        items:
          $ref: '#/definitions/domain.Identifier'
        type: array
      middleName:
        type: string
      phones:
        items:
          $ref: '#/definitions/domain.Contact'
        type: array
      roles:
        items:
          $ref: '#/definitions/domain.Role'
        type: array
      sourcedId:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      updatedAt:
        type: string
    type: object
  domain.Program:
    properties:
      code:
        type: string
      createdAt:
        type: string
      expiresAt:
        description: |-
          ExpiresAt is when the record stops being served and becomes eligible
          for deletion; nil means it never expires. Server-managed: only
          POST /api/v1/populate with a ttl sets it, and /api/v1 writes ignore it.
        type: string
      id:
        type: string
      level:
        description: |-
          Level is the qualification level, e.g. an EQF level ("6") or a local
          level code.
        type: string
      orgId:
        type: string
      sourcedId:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  domain.Result:
    properties:
      courseId:
        description: 'Exactly one of CourseID and ProgramID is set: what the result
          is for.'
        type: string
      createdAt:
        type: string
      credits:
        description: |-
          Credits awarded, in ECTS credits. Credits in other systems (e.g.
          local points) are not stored here.
        type: number
      expiresAt:
        description: |-
          ExpiresAt is when the record stops being served and becomes eligible
          for deletion; nil means it never expires. Server-managed: only
          POST /api/v1/populate with a ttl sets it, and /api/v1 writes ignore it.
        type: string
      grade:
        description: Grade is the grade as awarded, e.g. "A", "VG", "Pass".
        type: string
      id:
        type: string
      offeringId:
        description: |-
          OfferingID optionally names the offering (class) the result was
          obtained in.
        type: string
      personId:
        type: string
      programId:
        type: string
      resultDate:
        description: ResultDate is the ISO 8601 date the result was awarded.
        type: string
      sourcedId:
        type: string
      status:
        $ref: '#/definitions/domain.Status'
      updatedAt:
        type: string
    type: object
  domain.Role:
    enum:
    - student
    - staff
    - faculty
    - guest
    type: string
    x-enum-varnames:
    - RoleStudent
    - RoleStaff
    - RoleFaculty
    - RoleGuest
  domain.Status:
    enum:
    - active
    - inactive
    - tobedeleted
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusInactive
    - StatusToBeDeleted
  helpers.Error:
    properties:
      details: {}
      title:
        type: string
    type: object
  helpers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/helpers.Error'
    type: object
  readmodel.PopulateItem:
    properties:
      action:
        type: string
      id:
        type: string
      sourcedId:
        type: string
      type:
        type: string
    type: object
  restadmin.ListReply-domain_AcademicSession:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.AcademicSession'
        type: array
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      total:
        description: Total is the number of entities across all pages.
        type: integer
    type: object
  restadmin.ListReply-domain_Course:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Course'
        type: array
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      total:
        description: Total is the number of entities across all pages.
        type: integer
    type: object
  restadmin.ListReply-domain_Enrollment:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Enrollment'
        type: array
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      total:
        description: Total is the number of entities across all pages.
        type: integer
    type: object
  restadmin.ListReply-domain_Offering:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Offering'
        type: array
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      total:
        description: Total is the number of entities across all pages.
        type: integer
    type: object
  restadmin.ListReply-domain_Organization:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Organization'
        type: array
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      total:
        description: Total is the number of entities across all pages.
        type: integer
    type: object
  restadmin.ListReply-domain_Program:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Program'
        type: array
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      total:
        description: Total is the number of entities across all pages.
        type: integer
    type: object
  restadmin.ListReply-domain_Result:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.Result'
        type: array
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      total:
        description: Total is the number of entities across all pages.
        type: integer
    type: object
  restadmin.PersonListReply:
    properties:
      limit:
        description: Limit is the effective page size after defaulting and clamping.
        type: integer
      offset:
        type: integer
      persons:
        items:
          $ref: '#/definitions/domain.Person'
        type: array
      total:
        description: Total is the number of persons across all pages.
        type: integer
    type: object
info:
  contact: {}
  description: |-
    Native REST API of the Student Information System (/api/v1).

    Every endpoint needs a Bearer access token from one of the token
    issuers SIS trusts (sis.auth.issuers); SIS issues no tokens itself.
    Reads need scope sis.read and writes need scope sis.write, for
    people and machine clients alike. sis.write does not include
    sis.read.
  license:
    name: BSD-2-Clause
    url: https://opensource.org/license/bsd-2-clause
  title: SIS admin API
  version: "1.0"
paths:
  /academic-sessions:
    get:
      description: Lists academic sessions with limit/offset paging.
      operationId: list-academic-sessions
      parameters:
      - description: Page size; defaults to default_limit and is clamped to max_limit
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/restadmin.ListReply-domain_AcademicSession'
        "400":
          description: Invalid paging parameters
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List academic sessions
      tags:
      - academic-sessions
    post:
      consumes:
      - application/json
      description: Creates an academic session. title is required. id is generated
        when empty, sourcedId defaults to id, and createdAt/updatedAt are set by the
        server.
      operationId: create-academic-session
      parameters:
      - description: Academic session to create
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/domain.AcademicSession'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AcademicSession'
        "400":
          description: Malformed body or validation error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: id or sourcedId already in use
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create academic session
      tags:
      - academic-sessions
  /academic-sessions/{id}:
    delete:
      description: Deletes one academic session by id.
      operationId: delete-academic-session
      parameters:
      - description: Academic session id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete academic session
      tags:
      - academic-sessions
    get:
      description: Returns one academic session by id.
      operationId: get-academic-session
      parameters:
      - description: Academic session id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domain.AcademicSession'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get academic session
      tags:
      - academic-sessions
    put:
      consumes:
      - application/json
      description: Replaces an academic session. The path id wins over any id in the
        body; createdAt is preserved and an empty sourcedId keeps the stored one.
      operationId: update-academic-session
      parameters:
      - description: Academic session id
        in: path
        name: id
        required: true
        type: string
      - description: Replacement academic session
        in: body
        name: session
        required: true
        schema:
          $ref: '#/definitions/domain.AcademicSession'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domain.AcademicSession'
        "400":
          description: Malformed body or validation error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "409":
          description: sourcedId already in use
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Replace academic session
      tags:
      - academic-sessions
  /courses:
    get:
      description: Lists courses with limit/offset paging.
      operationId: list-courses
      parameters:
      - description: Page size; defaults to default_limit and is clamped to max_limit
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/restadmin.ListReply-domain_Course'
        "400":
          description: Invalid paging parameters
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List courses
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: Creates a course. title is required; orgId, when set, must be the
        id (not sourcedId) of an existing organization. id is generated when empty,
        sourcedId defaults to id, and createdAt/updatedAt are set by the server.
      operationId: create-course
      parameters:
      - description: Course to create
        in: body
        name: course
        required: true
        schema:
          $ref: '#/definitions/domain.Course'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Course'
        "400":
          description: Malformed body or validation error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: id or sourcedId already in use
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create course
      tags:
      - courses
  /courses/{id}:
    delete:
      description: Deletes one course by id.
      operationId: delete-course
      parameters:
      - description: Course id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete course
      tags:
      - courses
    get:
      description: Returns one course by id.
      operationId: get-course
      parameters:
      - description: Course id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domain.Course'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get course
      tags:
      - courses
    put:
      consumes:
      - application/json
      description: Replaces a course. orgId, when set, must be the id of an existing
        organization. The path id wins over any id in the body; createdAt is preserved
        and an empty sourcedId keeps the stored one.
      operationId: update-course
      parameters:
      - description: Course id
        in: path
        name: id
        required: true
        type: string
      - description: Replacement course
        in: body
        name: course
        required: true
        schema:
          $ref: '#/definitions/domain.Course'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/domain.Course'
        "400":
          description: Malformed body or validation error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "409":
          description: sourcedId already in use
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "413":
          description: Request body too large
