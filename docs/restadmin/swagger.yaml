  /populate:
    post:
      consumes:
      - application/json
      description: Converts data from metadata.input_format (elm) and upserts every
        record by sourcedId, so /eduapi and /oeapi (and /api/v1) serve them. With
        ttl the records stop being served after that duration and are then deleted;
        re-populating refreshes the expiry, but a record that already existed without
        expiry keeps none. References in the document must resolve within it or to
        stored records. The document is checked completely before anything is stored;
        a storage failure part-way leaves earlier records stored, and retrying the
        same request converges. Requires scope sis.write.
      operationId: populate
      parameters:
      - description: Document to load
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/command.PopulateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Stored records
          schema:
            $ref: '#/definitions/command.PopulateReply'
        "400":
          description: Malformed body, unsupported format, invalid ttl, or a document
            that cannot be converted
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: A record id collides with an existing record
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "413":
          description: Request body too large
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Load a document
      tags:
      - convert
