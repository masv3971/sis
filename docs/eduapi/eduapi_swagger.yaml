info:
  contact: {}
  description: |-
    Read-only publication of the SIS data in 1EdTech Edu-API v1.0 (Final) shapes.

    Every endpoint needs a Bearer access token from one of the token issuers
    SIS trusts (sis.auth.issuers), with scope sis.read or the spec's
    http://purl.1edtech.org/spec/eduapi/v1p0/scope/core.readonly.

    Lists are bare JSON arrays. X-Total-Count holds the number of stored
    records and Link the first, prev, next and last pages. A record is
    addressed by its sourcedId, and references between records are
    sourcedIds. Errors use the spec's Imsx_StatusInfo body. Lists that
    support sort and filter say so; the others answer 400.

    SIS stores less than the spec requires, so a required field with no data
    is filled in one of three ways. Free text (title, description) falls back
    to the record's own title, then its course title or sourcedId. An
    enumeration carries the extensible term ext:unspecified, except
    registrationStatus, which is always closed. References and dates are
    omitted rather than invented, so a client can receive a record without them.
  license:
    name: BSD-2-Clause
    url: https://opensource.org/license/bsd-2-clause
  title: SIS Edu-API v1.0
  version: "1.0"
paths:
  /academicSessions:
    get:
      description: Lists academic sessions. sort and filter accept sourcedId.
      operationId: list-academic-sessions
      parameters:
      - description: Page size; defaults to default_limit and is clamped to max_limit
        in: query
        minimum: 1
        name: limit
        type: integer
      - description: Number of items to skip
        in: query
        minimum: 0
        name: offset
        type: integer
      - description: Field to sort by
        in: query
        name: sort
        type: string
      - description: Sort direction
        enum:
        - asc
        - desc
        in: query
        name: orderBy
        type: string
      - description: One or two terms joined by AND or OR, e.g. sourcedId='x'
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          headers:
            Link:
              description: RFC 8288 first, prev, next and last links
              type: string
            X-Total-Count:
              description: Number of stored records
              type: integer
          schema:
            items:
              $ref: '#/definitions/eduapi.AcademicSession'
            type: array
        "400":
          description: Invalid query parameter or filter field
          schema:
            $ref: '#/definitions/eduapi.StatusInfo'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/eduapi.StatusInfo'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/eduapi.StatusInfo'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/eduapi.StatusInfo'
      security:
      - BearerAuth: []
      summary: List academic sessions
      tags:
      - academicSessions
  /academicSessions/{id}:
    get:
      description: Returns one academic session by sourcedId.
      operationId: get-academic-session
      parameters:
      - description: Academic session sourcedId
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/eduapi.AcademicSession'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/eduapi.StatusInfo'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/eduapi.StatusInfo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/eduapi.StatusInfo'
        "500":
          description: Internal Server Error
          schema:
