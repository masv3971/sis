info:
  contact: {}
  description: |-
    Read-only publication of the SIS data in Open Education API v6.0 shapes (/oeapi).

    Every endpoint needs a Bearer access token with scope sis.read from one of
    the token issuers SIS trusts (sis.auth.issuers).

    Lists use the OEAPI page envelope and pageNumber/pageSize. A record
    is addressed by its sourcedId, and references between records are
    sourcedIds, so every relationship can be followed through this API.
    sort and filter are not supported and answer 400.
  license:
    name: BSD-2-Clause
    url: https://opensource.org/license/bsd-2-clause
  title: SIS Open Education API (OEAPI) v6.0
  version: "6.0"
paths:
  /academic-sessions:
    get:
      description: Lists academic sessions in the OEAPI page envelope.
      operationId: list-academic-sessions
      parameters:
      - description: 1-based page number
        in: query
        minimum: 1
        name: pageNumber
        type: integer
      - description: Page size; defaults to default_page_size and is clamped to max_page_size
        in: query
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/oeapi.Page-oeapi_AcademicSession'
        "400":
          description: Invalid paging parameters, or sort/filter given
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
        "401":
          description: Missing, invalid or untrusted token
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Token lacks the required scope
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List academic sessions
      tags:
      - academic-sessions
  /academic-sessions/{id}:
    get:
      description: Returns one academic session by sourcedId.
      operationId: get-academic-session
      parameters:
      - description: Academic session sourcedId
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
