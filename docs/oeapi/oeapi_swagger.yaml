basePath: /oeapi
definitions:
  auth.ErrorResponse:
    properties:
      error:
        description: |-
          Error is "unauthorized" (401: missing, invalid or expired token, or
          one from an untrusted issuer), "forbidden" (403: the token lacks the
          required scope) or "unavailable" (503: the token's issuer could not be
          reached to check it; retry later).
        example: unauthorized
        type: string
      message:
        example: missing bearer token
        type: string
    type: object
  helpers.Error:
    properties:
      details: {}
      title:
        type: string
    type: object
  helpers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/helpers.Error'
    type: object
  oeapi.AcademicSession:
    properties:
      academicSessionId:
        type: string
      endDate:
        type: string
      name:
        type: string
      startDate:
        type: string
      type:
        type: string
    type: object
  oeapi.Association:
    properties:
      associationId:
        type: string
      offeringId:
        type: string
      personId:
        type: string
      result:
        allOf:
        - $ref: '#/definitions/oeapi.Result'
        description: Result is the person's result in the offering, when there is
          one.
      role:
        type: string
      state:
        type: string
    type: object
  oeapi.Course:
    properties:
      abbreviation:
        type: string
      courseId:
        type: string
      name:
        type: string
      organizationId:
        type: string
    type: object
  oeapi.Offering:
    properties:
      academicSessionId:
        type: string
      courseId:
        type: string
      name:
        type: string
      offeringId:
        type: string
    type: object
  oeapi.Organization:
    properties:
      name:
        type: string
      organizationId:
        type: string
      parentOrganization:
        type: string
      type:
        type: string
    type: object
  oeapi.Page-oeapi_AcademicSession:
    properties:
      hasNextPage:
        type: boolean
      hasPreviousPage:
        type: boolean
      items:
        items:
          $ref: '#/definitions/oeapi.AcademicSession'
        type: array
      pageNumber:
        type: integer
      pageSize:
        type: integer
      totalPages:
        type: integer
    type: object
  oeapi.Page-oeapi_Association:
    properties:
      hasNextPage:
        type: boolean
      hasPreviousPage:
        type: boolean
      items:
